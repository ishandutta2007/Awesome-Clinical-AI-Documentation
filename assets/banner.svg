<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark tech gradient background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#3a506b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
    }
    .pulsing-ecg {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 3.5s linear infinite;
    }
    .floating-card {
      animation: float 4s ease-in-out infinite;
    }
    .floating-card-delayed {
      animation: float 4s ease-in-out infinite 2s;
    }
    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.9; transform: scale(1.02); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Dynamic Background Elements (Kept in Background / Side) -->
  <!-- Dynamic Medical ECG Line across lower background -->
  <path class="pulsing-ecg" d="M 50 280 L 300 280 L 330 250 L 350 310 L 380 230 L 410 295 L 430 280 L 750 280 L 780 240 L 800 320 L 830 220 L 860 300 L 890 280 L 1150 280" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.4" />
  
  <!-- Animated Ambient AI Nodes / Graphic Elements on Right Side -->
  <g transform="translate(850, 40)" class="floating-card">
    <rect x="0" y="0" width="280" height="130" rx="12" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" backdrop-filter="blur(8px)"/>
    <circle cx="35" cy="35" r="14" fill="url(#cyan-glow)" />
    <!-- Medical Cross Icon -->
    <path d="M 35 27 L 35 43 M 27 35 L 43 35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <text x="62" y="32" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Ambient Clinical AI</text>
    <text x="62" y="48" font-family="Segoe UI, sans-serif" font-weight="400" font-size="11" fill="#38bdf8">Real-time Encounter Capture</text>
    
    <path d="M 25 75 H 255" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <rect x="25" y="88" width="70" height="22" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="60" y="103" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="11" fill="#34d399">SOAP Notes</text>
    
    <rect x="105" y="88" width="70" height="22" rx="6" fill="rgba(14, 165, 233, 0.2)" stroke="#0ea5e9" stroke-width="1"/>
    <text x="140" y="103" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="11" fill="#38bdf8">MedASR</text>

    <rect x="185" y="88" width="70" height="22" rx="6" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
    <text x="220" y="103" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="11" fill="#c084fc">FHIR R4</text>
  </g>

  <g transform="translate(890, 190)" class="floating-card-delayed">
    <rect x="0" y="0" width="240" height="110" rx="12" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="10" fill="#10b981" />
    <path d="M 26 30 L 29 33 L 35 27" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="50" y="34" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">98-99% Cost Savings</text>
    <text x="25" y="62" font-family="Segoe UI, sans-serif" font-weight="400" font-size="11" fill="#94a3b8">Open-Source EHR Integration</text>
    <text x="25" y="82" font-family="Segoe UI, sans-serif" font-weight="600" font-size="12" fill="#34d399">~$0.02 / Encounter</text>
  </g>

  <!-- FOREGROUND: Main Title and Subtitle Header (Guaranteed High Contrast & Unobstructed) -->
  <g transform="translate(70, 0)">
    <!-- Decorative Tag Badge -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="260" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="15" cy="15" r="4" fill="#00f2fe" filter="url(#glow)"/>
      <text x="28" y="20" font-family="Segoe UI, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="1">AWESOME CLINICAL AI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title" filter="url(#glow)">Clinical AI Documentation</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Ambient Scribing • Speech Recognition • EHR Note Automation</text>

    <!-- Detailed Tagline -->
    <text x="0" y="215" class="tagline">Curated directory of top commercial SaaS platforms &amp; open-source clinical documentation tools.</text>
    <text x="0" y="238" class="tagline">Empowering healthcare providers, clinical informaticists, and AI developers.</text>

    <!-- Feature Pill Tags -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="32" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text x="67" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">🏥 SaaS Benchmarks</text>

      <!-- Pill 2 -->
      <rect x="147" y="0" width="145" height="32" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text x="219" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">🔓 Open-Source Repos</text>

      <!-- Pill 3 -->
      <rect x="304" y="0" width="145" height="32" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text x="376" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">⚡ Market Analytics</text>
    </g>
  </g>
</svg>
